<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Holicay Travel Creator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Holicay creator app: navy sidebar + beige workspace, white cards. Single light theme, matching the Holicay product. */
:root{
  --coral:#f25142;--coral-hover:#de3f30;--navy:#133a4a;--navy-hover:#0f2f3c;
  --beige:#f6f3ee;--blush:#fdeee9;--peach:#f9c6bc;--meta:#b8c4cf;
  --ink:#101828;--ink2:#414651;--ink3:#717680;--line:#d5d7da;--line2:#e9eaeb;--surf:#f5f5f5;--white:#ffffff;--warm:#fbfaf8;
  --bad:#b42318;--bad-line:#d92d20;--bad-bg:#fef3f2;--bad-soft:#fecdca;--bad-sub:#912018;
  --ok:#067647;--ok-bg:#ecfdf3;--ok-soft:#abefc6;--ok-sub:#085d3a;
  --info-bg:#eef3f6;--info-line:#c9d7df;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --shadow:0 1px 2px rgba(16,24,40,0.06);
  color-scheme:light;
}
html,body{height:100%}
#root{min-height:100%;display:flex;flex-direction:column}
.app,.auth{flex:1}
body{background:var(--beige);color:var(--ink);font-family:var(--font);font-size:14px;line-height:20px;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font-family:inherit}
a{color:var(--navy)}a:hover{color:var(--coral)}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
h1,h2,h3{text-wrap:balance}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-variant-numeric:tabular-nums}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border:1px solid transparent;border-radius:8px;font-size:16px;line-height:24px;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn-primary{background:var(--coral);color:var(--white)}
.btn-primary:hover{background:var(--coral-hover);color:var(--white)}
.btn-secondary{background:var(--white);border-color:var(--line);color:var(--navy)}
.btn-secondary:hover{border-color:var(--navy);color:var(--navy)}
.btn-navy{background:var(--navy);color:var(--white)}
.btn-navy:hover{background:var(--navy-hover);color:var(--white)}
.btn-danger{background:var(--bad-line);color:var(--white)}
.btn-danger:hover{background:var(--bad);color:var(--white)}
.btn-sm{min-height:36px;padding:0 12px;font-size:14px;line-height:20px}
.btn[disabled]{cursor:not-allowed}
.btn.is-off{background:var(--line2);color:var(--ink3)}
.btn.is-busy{opacity:.85;cursor:progress}
.linkbtn{padding:0;border:0;background:none;font-size:inherit;line-height:inherit;font-weight:600;color:var(--coral);cursor:pointer}
.linkbtn:hover{text-decoration:underline}
.spin{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* layout */
.app{display:flex;min-height:100%}
.side{flex:0 0 264px;position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto;padding:28px 16px 20px max(16px,env(safe-area-inset-left,0px));background:var(--navy);color:var(--white);display:flex;flex-direction:column;gap:40px}
.brand{display:flex;align-items:flex-start;gap:10px;padding:0 12px}
.brand a{display:flex;flex-direction:column;gap:8px;text-decoration:none}
.brand img{display:block;height:28px;width:auto}
.brand-tag{font-size:11px;line-height:16px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--peach)}
.navtoggle,.menubtn{margin-left:auto;width:36px;height:36px;flex:none;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.16);border-radius:8px;background:transparent;color:var(--meta);cursor:pointer}
.navtoggle:hover,.menubtn:hover{background:rgba(255,255,255,.08);color:var(--white)}
.menubtn{display:none}
.side-links{display:flex;flex-direction:column;gap:4px}
.navlink{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:8px;font-size:14px;font-weight:500;text-decoration:none;color:var(--meta)}
.navlink:hover{background:rgba(255,255,255,.08);color:var(--white)}
.navlink[aria-current="page"]{background:rgba(255,255,255,.14);color:var(--white);font-weight:600}
.side :focus-visible{outline-color:var(--white)}
.who{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;background:rgba(255,255,255,.06)}
.avatar{width:36px;height:36px;flex:none;border-radius:999px;background:var(--blush);color:var(--navy);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.who-name{font-size:14px;line-height:20px;font-weight:600;color:var(--white)}
.who-link{font-size:12px;line-height:16px;color:var(--meta)}
.who-link:hover{color:var(--white)}
.logout{margin-left:auto;width:36px;height:36px;flex:none;display:flex;align-items:center;justify-content:center;border:0;border-radius:8px;background:none;color:var(--meta);cursor:pointer}
.logout:hover{background:rgba(255,255,255,.08);color:var(--white)}
.app.mini .side{flex-basis:76px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:12px}
.app.mini .brand{padding:0;justify-content:center}
.app.mini .brand a{display:none}
.app.mini .navtoggle{margin-left:0}
.app.mini .navtoggle svg{transform:scaleX(-1)}
.app.mini .navlink{font-size:0;gap:0;justify-content:center;padding:0}
.app.mini .who{justify-content:center;padding-left:0;padding-right:0;background:none}
.app.mini .who-text,.app.mini .logout{display:none}
main.page{flex:1;min-width:0;padding:32px max(40px,env(safe-area-inset-right,0px)) 96px 40px}
.wrap{max-width:1160px;display:flex;flex-direction:column;gap:24px}
.wrap.narrow{max-width:800px}

@media (max-width:860px){
  .app{flex-direction:column}
  .side{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;height:auto;flex:none;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));gap:12px;overflow:visible}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--navy)}
  .brand{padding:0;align-items:center}
  .brand a{flex-direction:row;align-items:center;gap:10px}
  .brand img{height:24px}
  .navtoggle{display:none}
  .menubtn{display:flex}
  .side-links,.who{display:none}
  .app.menu-open .side-links{display:flex}
  .app.menu-open .who{display:flex;margin-top:0}
  .app.mini .side{padding-left:max(16px,env(safe-area-inset-left,0px))}
  .app.mini .brand a{display:flex}
  .app.mini .navlink{font-size:14px;gap:12px;justify-content:flex-start;padding:0 12px}
  .app.mini .who-text,.app.mini .logout{display:flex}
  main.page{padding:24px max(16px,env(safe-area-inset-right,0px)) 96px max(16px,env(safe-area-inset-left,0px))}
}

/* type */
.h1{margin:0;font-size:32px;line-height:40px;font-weight:600;color:var(--navy)}
.h2{margin:0;font-size:20px;line-height:30px;font-weight:600;color:var(--navy)}
.h3{margin:0;font-size:18px;line-height:28px;font-weight:600;color:var(--navy)}
.lead{margin:0;font-size:16px;line-height:24px;color:var(--ink2)}
.sub{margin:0;font-size:14px;line-height:20px;color:var(--ink2)}
.small{font-size:12px;line-height:16px;color:var(--ink3)}
.back{align-self:flex-start;font-size:14px;line-height:20px;font-weight:500;color:var(--ink2)}
@media (max-width:600px){.h1{font-size:26px;line-height:34px}}

/* cards */
.card{background:var(--white);border:1px solid var(--line2);border-radius:12px;box-shadow:var(--shadow)}
.pad{padding:20px}
.pad24{padding:24px}
.stack{display:flex;flex-direction:column}
.g2{gap:2px}.g4{gap:4px}.g8{gap:8px}.g12{gap:12px}.g16{gap:16px}.g20{gap:20px}.g24{gap:24px}
.row{display:flex;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:16px}
@media (max-width:600px){.grid-cards.stats{grid-template-columns:1fr 1fr;gap:12px}.grid-cards.stats .stat{font-size:24px;line-height:32px}.grid-cards.stats .card{padding:16px}}
.grid-fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.split{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.split>.main-col{flex:2 1 600px;min-width:0}
.split>.side-col{flex:1 1 300px;min-width:0}
.dash-split>.main-col{flex:3 1 860px}
.dash-split>.side-col{flex:1 1 280px;container-type:inline-size}
@container (min-width:640px){.dash-split .ratelist{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.dash-split .ratelist li{flex-direction:column;justify-content:space-between;gap:4px;padding:12px 14px;border:1px solid var(--line2);border-radius:8px;color:var(--ink2)}.dash-split .ratelist li>:last-child{font-size:20px;line-height:28px;font-weight:600;color:var(--navy)}}
.stat-label{font-size:14px;line-height:20px;color:var(--ink2)}
.stat{font-size:32px;line-height:40px;font-weight:600;color:var(--navy);font-variant-numeric:tabular-nums}
.chip{padding:4px 10px;background:var(--white);border:1px solid var(--line2);border-radius:999px;font-size:12px;line-height:16px;font-weight:500;color:var(--ink2)}
.chip.strong{font-weight:600;color:var(--navy)}

/* pills */
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;line-height:16px;font-weight:600;white-space:nowrap}
.pill-booked{background:var(--navy);color:var(--white)}
.pill-req{padding:1px 7px;border:1px solid var(--line);background:var(--white);color:var(--ink2)}
.pill-soft{background:var(--blush);color:var(--navy)}
.pill-roll{padding:1px 7px;border:1px solid var(--line);background:var(--beige);color:var(--navy)}
.pill-bad{padding:1px 7px;border:1px solid var(--bad-soft);background:var(--bad-bg);color:var(--bad)}
.pill-line{padding:1px 7px;border:1px solid var(--line);color:var(--ink2)}

/* controls */
.seg-group{display:flex;flex-wrap:wrap}
.seg{min-height:44px;padding:0 20px;margin-left:-1px;border:1px solid var(--line);background:var(--white);color:var(--ink2);font-size:14px;font-weight:500;cursor:pointer}
.seg:first-child{margin-left:0;border-radius:8px 0 0 8px}
.seg:last-child{border-radius:0 8px 8px 0}
.seg:hover{background:var(--surf)}
.seg.on{position:relative;background:var(--navy);border-color:var(--navy);color:var(--white);font-weight:600}
@media (max-width:600px){.seg-group{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:100%}.seg{margin-left:0;padding:0 12px;border-radius:8px!important}}
.ftabs{display:flex;flex-wrap:wrap;gap:6px}
.ftab{min-height:36px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--white);color:var(--ink2);font-size:14px;font-weight:500;cursor:pointer}
.ftab:hover{border-color:var(--navy)}
.ftab.on{background:var(--surf);color:var(--navy);font-weight:600}
.daterange{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:6px;background:var(--white);border:1px solid var(--line);border-radius:10px}
.daterange label{display:flex;align-items:center;gap:8px;padding-left:8px;font-size:14px;font-weight:500;color:var(--ink2)}
.daterange input{min-height:36px;padding:0 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;color:var(--ink);background:var(--white)}
.daterange input.bad{border-color:var(--bad-line)}
.search{display:flex;align-items:center;gap:8px;min-height:36px;padding:0 12px;border:1px solid var(--line);border-radius:8px;color:var(--ink3);width:220px;max-width:100%;background:var(--white)}
.search input{border:0;outline-offset:4px;background:transparent;width:100%;font-size:14px;color:var(--ink);min-height:34px}
.select{min-height:36px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--white);font-size:14px;color:var(--navy)}
.errline{margin:0;display:flex;gap:6px;font-size:14px;line-height:20px;color:var(--bad)}
.errline svg{flex:none;margin-top:2px}

/* fields */
.fld{display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:20px;font-weight:500;color:var(--ink2)}
.fld input,.fld select,.fld textarea{min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--white);font-size:16px;color:var(--ink);box-shadow:var(--shadow);width:100%}
.fld input.bad,.fld select.bad{border-color:var(--bad-line)}
.fld input:disabled{background:var(--surf);color:var(--ink2);box-shadow:none;cursor:not-allowed;-webkit-text-fill-color:var(--ink2);opacity:1}
.hint{font-weight:400;color:var(--ink3)}
.err{display:flex;gap:6px;font-weight:400;color:var(--bad)}
.err svg{flex:none;margin-top:2px}
.full{grid-column:1/-1}
.opt{display:flex;gap:12px;align-items:flex-start;padding:16px;border:1px solid var(--line);border-radius:10px;background:var(--white);cursor:pointer}
.opt:hover{border-color:var(--navy)}
.opt.on{border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy);background:var(--warm)}
.opt input{margin:2px 0 0;width:18px;height:18px;accent-color:var(--navy);flex:none}
.opt-title{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:16px;line-height:24px;font-weight:600;color:var(--navy)}
.kind{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:8px;background:var(--white);font-size:14px;font-weight:500;color:var(--navy);cursor:pointer}
.kind input{width:16px;height:16px;margin:0;accent-color:var(--navy)}
.chk{display:flex;align-items:flex-start;gap:12px;padding:14px 0;border-top:1px solid var(--line2);cursor:pointer}
.chk input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--navy);flex:none}
.lockpill{display:inline-flex;align-items:center;gap:4px;padding:0 6px;border-radius:6px;background:var(--surf);color:var(--ink3);font-size:12px;line-height:18px;font-weight:600}
.divider{padding-top:16px;border-top:1px solid var(--line2)}

/* banners */
.banner{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border:1px solid;border-radius:10px;font-size:14px;line-height:20px}
.banner svg{flex:none}
.banner .bt{flex:1;display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.banner strong{font-weight:600}
.banner.ok{border-color:var(--ok-soft);background:var(--ok-bg);color:var(--ok)}
.banner.ok .bs{color:var(--ok-sub)}
.banner.bad{border-color:var(--bad-soft);background:var(--bad-bg);color:var(--bad)}
.banner.bad .bs{color:var(--bad-sub)}
.banner.info{border-color:var(--info-line);background:var(--info-bg);color:var(--navy)}
.banner.info .bs{color:var(--ink2)}
.banner.note{border-color:transparent;background:var(--beige);color:var(--ink2)}
.banner.tight{padding:12px 14px;border-radius:8px}
.x{width:32px;height:32px;flex:none;display:flex;align-items:center;justify-content:center;border:0;border-radius:8px;background:none;color:inherit;cursor:pointer}
.x:hover{background:rgba(16,24,40,.06)}

/* tables */
.tablewrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14px;line-height:20px}
.tbl th{padding:10px 12px;text-align:left;background:var(--surf);font-size:12px;font-weight:600;color:var(--ink2);border-top:1px solid var(--line2);border-bottom:1px solid var(--line2);white-space:nowrap}
.tbl td{padding:14px 12px;border-bottom:1px solid var(--line2);vertical-align:top}
.tbl th:first-child,.tbl td:first-child{padding-left:20px}
.tbl th:last-child,.tbl td:last-child{padding-right:20px}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl .r{text-align:right}
.tbl .nw{white-space:nowrap}
.tbl .muted{color:var(--ink2)}
.tbl .strong{font-weight:600;color:var(--navy)}
.tbl tbody tr.clickable{cursor:pointer}
.tbl.trips th,.tbl.trips td{padding-left:8px;padding-right:8px}.tbl.trips th{white-space:normal;vertical-align:bottom}.tbl.trips th:first-child,.tbl.trips td:first-child{padding-left:20px}.tbl.trips th:last-child,.tbl.trips td:last-child{padding-right:20px}
@media (max-width:640px){.tbl.stack-sm{min-width:0!important}.tbl.stack-sm thead{display:none}.tbl.stack-sm tbody tr{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;padding:16px 20px;border-bottom:1px solid var(--line2)}.tbl.stack-sm tbody tr:last-child{border-bottom:0}.tbl.stack-sm td{padding:0!important;border:0!important;text-align:left!important;white-space:normal!important}.tbl.stack-sm td:first-child{grid-column:1/-1}.tbl.stack-sm td[data-label]::before{content:attr(data-label);display:block;margin-bottom:2px;font-size:12px;line-height:16px;font-weight:500;color:var(--ink3)}.tbl.stack-sm td.empty-cell{grid-column:1/-1;text-align:center!important}}
.tbl tbody tr.clickable:hover td{background:var(--warm)}
.tbl .struck,.struck{text-decoration:line-through;color:var(--ink3);font-weight:500}
.tlink{font-weight:600;color:var(--navy);text-decoration:none}
.tlink:hover{text-decoration:underline;color:var(--navy)}
.tfoot{padding:14px 20px;border-top:1px solid var(--line2);display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px}
.empty{border-top:1px solid var(--line2);padding:56px 24px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.empty-ic{width:48px;height:48px;border-radius:999px;background:var(--blush);color:var(--navy);display:flex;align-items:center;justify-content:center}
.empty-ic.grey{background:var(--surf);color:var(--ink2)}
.empty p{margin:0;max-width:440px;font-size:14px;line-height:20px;color:var(--ink2)}

/* calendar */
.datebtn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:8px;background:var(--white);color:var(--navy);font-size:14px;font-weight:600;cursor:pointer}
.datebtn:hover,.datebtn.open{border-color:var(--navy)}
.cal-anchor{position:relative;height:0}
.cal-pop{position:absolute;z-index:30;top:4px;left:0;width:660px;max-width:100%;padding:20px;background:var(--white);border:1px solid var(--line2);border-radius:12px;box-shadow:0 16px 40px rgba(16,24,40,.16);display:flex;flex-direction:column;gap:16px}
.cal-months{display:flex;gap:28px}
.cal-month{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.cal-title{display:flex;align-items:center;justify-content:space-between;height:36px;font-size:16px;font-weight:600;color:var(--navy)}
.cal-nav{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line2);border-radius:8px;background:var(--white);color:var(--ink2);cursor:pointer}
.cal-nav:hover{border-color:var(--navy);color:var(--navy)}
.cal-nav[disabled]{opacity:.35;cursor:not-allowed}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);row-gap:2px}
.cal-wd{font-size:12px;line-height:28px;text-align:center;color:var(--ink3);font-weight:500}
.cal-d{height:40px;padding:0;border:0;background:none;font-size:14px;color:var(--ink);cursor:pointer;font-variant-numeric:tabular-nums}
.cal-d span{display:flex;width:36px;height:36px;margin:2px auto;align-items:center;justify-content:center;border-radius:999px}
.cal-d:hover span{background:var(--surf)}
.cal-d.in{background:var(--blush)}
.cal-d.rs{background:linear-gradient(90deg,transparent 50%,var(--blush) 50%)}
.cal-d.re{background:linear-gradient(90deg,var(--blush) 50%,transparent 50%)}
.cal-d.sel span,.cal-d.sel:hover span{background:var(--navy);color:var(--white);font-weight:600}
.cal-d.today span{box-shadow:inset 0 0 0 1.5px var(--coral)}
.cal-d.dis{color:#c4c7cc;cursor:not-allowed}
.cal-d.dis:hover span{background:none}
.cal-foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-top:16px;border-top:1px solid var(--line2)}
.cal-nav.m-only{visibility:hidden}
@media (max-width:760px){.cal-month:first-child{display:none}.cal-nav.m-only{visibility:visible}.cal-pop{padding:16px}.cal-d{height:44px}.cal-d span{width:40px;height:40px}}
/* tooltip */
.tipwrap{position:relative;display:flex;align-items:center;gap:4px;height:20px}
.tipbtn{width:24px;height:24px;padding:0;display:flex;align-items:center;justify-content:center;border:0;border-radius:999px;background:transparent;color:var(--ink3);cursor:pointer}
.tipbtn:hover{background:var(--surf);color:var(--navy)}
.tipbox{display:none;position:absolute;z-index:20;top:calc(100% + 10px);left:-8px;width:280px;max-width:calc(100vw - 48px);padding:14px;border-radius:10px;background:var(--navy);color:var(--white);box-shadow:0 12px 24px rgba(16,24,40,.18);font-size:14px;line-height:20px}
.tipbox.short::before{left:64px}
.tipbox::before{content:"";position:absolute;top:-6px;left:96px;width:12px;height:12px;background:var(--navy);transform:rotate(45deg)}
.tipwrap:hover .tipbox,.tipwrap:focus-within .tipbox,.tipbox.open{display:block}
.tipbox .tm{display:block;font-size:12px;line-height:16px;color:var(--meta)}

/* list rows */
.ratelist{list-style:none;margin:0;padding:0;font-size:14px;line-height:20px}
.ratelist li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line2)}
.ratelist li:last-child{border-bottom:0}
.ratelist li.hit{margin:0 -10px;padding-left:10px;padding-right:10px;border-radius:8px;background:var(--blush);border-bottom-color:transparent}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.timeline li{display:flex;gap:12px}
.tl-rail{display:flex;flex-direction:column;align-items:center}
.tl-dot{width:12px;height:12px;margin-top:4px;border-radius:999px;background:var(--navy)}
.tl-dot.todo{border:2px solid var(--ink3);background:var(--white)}
.tl-dot.bad{background:var(--bad-line)}
.tl-line{flex:1;width:2px;min-height:32px;background:var(--navy)}
.tl-line.todo{background:var(--line)}
.tl-body{padding-bottom:16px;display:flex;flex-direction:column}
.tl-t{font-size:14px;line-height:20px;font-weight:600;color:var(--ink)}
.tl-s{font-size:14px;line-height:20px;color:var(--ink2)}

/* promo */
.promo{display:flex;align-items:center;gap:12px;padding:6px 6px 6px 14px;background:var(--white);border:1px solid var(--line);border-radius:10px}
.promo-code{font-size:16px;line-height:24px;font-weight:600;color:var(--navy);letter-spacing:.04em}

/* modal */
.overlay{position:fixed;inset:0;z-index:60;padding:16px;background:rgba(16,24,40,.55);display:flex;align-items:center;justify-content:center}
.dialog{width:100%;max-width:480px;max-height:100%;overflow-y:auto;background:var(--white);border-radius:12px;box-shadow:0 20px 40px rgba(16,24,40,.2);padding:24px;display:flex;flex-direction:column;gap:20px}
.dialog.sm{max-width:440px}
.ring{width:48px;height:48px;border-radius:999px;background:var(--blush);color:var(--navy);display:flex;align-items:center;justify-content:center;flex:none}
.ring.bad{background:var(--bad-bg);color:var(--bad)}
.ring.ok{background:var(--ok-bg);color:var(--ok)}
.codebox{cursor:not-allowed;display:flex;align-items:center;min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--surf);font-size:16px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}

/* skeleton */
.sk{display:block;border-radius:6px;background:linear-gradient(90deg,#eceef1 25%,#f6f7f9 50%,#eceef1 75%);background-size:200% 100%;animation:sk 1.4s ease-in-out infinite}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.sk,.spin{animation:none}}

/* auth */
.auth{min-height:100%;padding-block:48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px}
.auth-card{width:100%;max-width:440px;padding:40px 32px;display:flex;flex-direction:column;gap:24px}
@media (max-width:480px){.auth-card{padding:28px 20px}}
.auth-brand{display:flex;align-items:center;gap:10px}
.auth-brand img{display:block;height:32px;width:auto}
.tagline{padding:2px 8px;border:1px solid var(--line);border-radius:999px;font-size:12px;line-height:16px;font-weight:600;color:var(--ink2)}
.auth-h{margin:0;font-size:24px;line-height:32px;font-weight:600;color:var(--navy)}
.lbl{font-size:14px;line-height:20px;font-weight:500;color:var(--ink2)}
.rules{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:14px;line-height:20px}
.rules li{display:flex;align-items:center;gap:8px;color:var(--ink3)}
.rules li.met{color:var(--ok)}
.demo-note{width:100%;max-width:440px;padding:14px 16px;border:1px dashed var(--line);border-radius:10px;font-size:13px;line-height:20px;color:var(--ink2);display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.demo-note code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;padding:1px 5px;border-radius:4px;background:var(--white);color:var(--navy)}

/* login split */
.auth-split{flex:1;display:flex;flex-wrap:wrap-reverse;background:var(--beige)}
.auth-split>.auth{flex:1 1 480px}
.auth-split>aside{padding-left:max(56px,env(safe-area-inset-left,0px))!important}
@media (min-width:1056px){.auth-split .auth-brand{display:none}}
.phone-only{display:none}
@media (max-width:640px){
  .auth-split{flex-direction:column;flex-wrap:nowrap}
  .auth-split>aside{display:none!important}
  .phone-only{display:block}
  .auth-split>.phone-only>[role="region"]{padding-left:max(20px,env(safe-area-inset-left,0px))!important;padding-right:max(20px,env(safe-area-inset-right,0px))!important}
  .auth-split>.auth{flex:none;padding-block:48px 40px;justify-content:flex-start}
  .auth-split .auth-brand{display:none}
  .auth-split .auth-card{padding:28px 20px}
}
/* prototype panel */
.proto{position:fixed;z-index:80;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.proto-btn{display:flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border:0;border-radius:999px;background:var(--ink);color:var(--white);font-size:13px;font-weight:600;cursor:pointer;box-shadow:0 8px 20px rgba(16,24,40,.24)}
.proto-btn:hover{background:#000}
.proto-dot{width:8px;height:8px;border-radius:999px;background:var(--coral)}
.proto-panel{width:300px;max-width:calc(100vw - 32px);max-height:calc(100vh - 100px);overflow-y:auto;padding:16px;border-radius:12px;background:var(--white);border:1px solid var(--line2);box-shadow:0 16px 40px rgba(16,24,40,.22);display:flex;flex-direction:column;gap:14px}
.proto-h{margin:0;font-size:14px;line-height:20px;font-weight:600;color:var(--ink)}
.proto-sec{display:flex;flex-direction:column;gap:6px}
.proto-label{font-size:11px;line-height:16px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.proto-opt{display:flex;align-items:flex-start;gap:8px;font-size:13px;line-height:18px;color:var(--ink);cursor:pointer}
.proto-opt input{margin:1px 0 0;accent-color:var(--navy);flex:none}
.proto-act{display:flex;align-items:center;min-height:32px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--white);font-size:13px;font-weight:500;color:var(--navy);cursor:pointer;text-align:left}
.proto-act:hover{border-color:var(--navy)}
.toast{position:fixed;z-index:90;left:50%;bottom:max(24px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:10px 16px;border-radius:999px;background:var(--ink);color:var(--white);font-size:14px;font-weight:500;box-shadow:0 8px 20px rgba(16,24,40,.24);max-width:calc(100vw - 32px)}
</style>

var TODAY = '2026-11-07';
var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

/* ---------- helpers ---------- */
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function usd(n) { return 'USD ' + Number(n).toLocaleString('en-US'); }
function parts(iso) { var p = iso.split('-'); return { y: +p[0], m: +p[1], d: +p[2] }; }
function fmt(iso) { var p = parts(iso); return p.d + ' ' + MON[p.m - 1] + ' ' + p.y; }
function fmtShort(iso) { var p = parts(iso); return p.d + ' ' + MON[p.m - 1]; }
function fmtRange(a, b) {
  var x = parts(a), y = parts(b);
  if (x.y !== y.y) return fmt(a) + ' to ' + fmt(b);
  if (x.m !== y.m) return x.d + ' ' + MON[x.m - 1] + ' to ' + y.d + ' ' + MON[y.m - 1] + ' ' + y.y;

    '<div class="fld"><span class="row g8">Promo code' + '<span class="lockpill">' + svg(I.lock, 12, 2) + 'Locked</span>' + '</span><div class="row g8" style="flex-wrap:nowrap"><div class="codebox" style="letter-spacing:.04em;font-weight:600;color:var(--navy)">ANNA10</div><span class="pill pill-soft">20% off</span></div></div></div><p class="small" style="font-size:14px;line-height:20px">Your page link and promo code are set by Holicay and can’t be changed. Followers get 20% off Holicay Pro with your code.</p></section>';
  h += '<section class="card pad24 stack g16" aria-labelledby="pw-h"><h2 id="pw-h" class="h3">Password</h2>';
  if (!M.editing) {
    h += '<div class="row g12" style="align-items:flex-end"><div class="fld" style="flex:1 1 240px"><label for="p-pw">Password</label><input id="p-pw" type="password" value="password123" disabled></div><button type="button" class="btn btn-secondary" data-act="meEdit">Change password</button></div><p class="small">' + (M.saved ? 'Last changed today.' : 'Last changed 12 Aug 2026.') + '</p>';
  } else {
    function pw(key, label, ac, hint) { return '<div class="fld"><label for="pw-' + key + '">' + label + '</label><input id="pw-' + key + '" type="password" autocomplete="' + ac + '" value="' + esc(M.v[key]) + '" data-bind="me.v.' + key + '" data-clear="me.' + key + '" class="' + (e[key] ? 'bad' : '') + '" aria-invalid="' + !!e[key] + '">' + fieldErr(e[key]) + (hint ? '<span class="hint">' + hint + '</span>' : '') + '</div>'; }
    h += '<div class="stack g16" style="max-width:420px">' + pw('cur', 'Current password', 'current-password') + pw('nw', 'New password', 'new-password', 'Use at least 8 characters, with at least one letter and one number.') + pw('cf', 'Confirm new password', 'new-password') +
      '<div class="row g12">' + (M.busy ? '<button type="button" class="btn btn-primary is-busy" disabled aria-busy="true">' + SPIN + 'Updating…</button>' : '<button type="button" class="btn btn-primary" data-act="meSubmit">Update password</button>') + '<button type="button" class="btn btn-secondary" data-act="meCancel">Cancel</button></div>' +
      '<p class="small">Prototype: the current password is <strong>holicay2026</strong>.</p></div>';
  }
  h += '</section>';
  h += '<section class="card pad24 stack g16" aria-labelledby="acct-h"><h2 id="acct-h" class="h3">Account</h2>' +
    '<div class="row between g12"><div class="stack g2"><span style="font-weight:600">Log out</span><span class="sub">Log out of Holicay on this device.</span></div><button type="button" class="btn btn-secondary" data-act="logout">Log out</button></div>' +
    '<div class="row between g12 divider"><div class="stack g2"><span style="font-weight:600">Delete account</span><span class="sub">Permanently close your creator account and remove your page.</span></div><button type="button" class="btn btn-secondary" style="color:var(--bad);border-color:var(--bad-soft)" data-act="openDelete">Delete account</button></div></section></div>';
  if (M.del) {
    var pendingTotal = payouts().filter(function (p) { return p.upcoming; }).reduce(function (a, p) { return a + p.amount; }, 0);
    h += '<div class="overlay" data-act="closeDelete" data-self="1"><div class="dialog sm" role="alertdialog" aria-modal="true" aria-labelledby="del-h" aria-describedby="del-d"><span class="ring bad">' + svg(I.trash, 24) + '</span><div class="stack g4"><h2 id="del-h" class="h2">Delete your creator account?</h2><p id="del-d" class="sub">You’ll lose access to your dashboard and trip history straight away, and your page and promo code will stop working.' + (pendingTotal ? ' Payouts already pending (' + usd(pendingTotal) + ') will still be paid to your payout method.' : '') + '</p></div>' +
      '<label class="row g8" style="flex-wrap:nowrap;align-items:flex-start;cursor:pointer"><input type="checkbox"' + (M.delOk ? ' checked' : '') + ' data-act="toggleDel" style="width:18px;height:18px;margin:1px 0 0;accent-color:var(--bad-line);flex:none">I understand this can’t be undone.</label>' +
      '<div class="row g12" style="justify-content:flex-end"><button type="button" class="btn btn-secondary" data-act="closeDelete">Keep my account</button>' + (M.delOk ? '<button type="button" class="btn btn-danger" data-act="doDelete">Delete account</button>' : '<button type="button" class="btn is-off" disabled>Delete account</button>') + '</div></div></div>';
  }
  return h;
}

/* ---------- error + not found ---------- */
function viewError() {
  return '<div class="auth"><main class="card auth-card" style="align-items:flex-start"><img src="' + LOGO + '" alt="Holicay" style="height:32px;width:auto"><span class="ring bad">' + svg(I.cloud, 24) + '</span>' +
    '<div class="stack g4"><h1 class="auth-h">Something went wrong</h1><p class="sub">We couldn’t load this page. Your trips and payouts are safe. Check your connection and try again.</p></div>' +

    '<p class="sub">Still not working? <a href="#" data-act="help" style="font-weight:600">Contact the Holicay team</a> and mention error code 500.</p></main></div>';
}
function viewNotFound() {
  return '<div class="wrap"><div class="card pad24 stack g12" style="align-items:flex-start"><h1 class="h2">We couldn’t find that trip</h1><p class="sub">It may have been removed, or the link is wrong.</p><a class="btn btn-secondary btn-sm" href="#trips">See all trips</a></div></div>';
}

/* ---------- prototype panel ---------- */
function protoPanel() {
  var d = S.demo;
  var h = '<div class="proto">';
  if (d.open) {
    function radio(group, val, label) { return '<label class="proto-opt"><input type="radio" name="p-' + group + '"' + (d[group] === val ? ' checked' : '') + ' data-act="demo" data-group="' + group + '" data-arg="' + val + '">' + label + '</label>'; }
    h += '<div class="proto-panel" role="dialog" aria-label="Prototype controls"><div class="row between"><h2 class="proto-h">Prototype controls</h2><button type="button" class="x" data-act="protoToggle" aria-label="Close prototype controls">' + svg(I.x, 16, 2) + '</button></div>' +
      '<div class="proto-sec"><span class="proto-label">Creator</span>' + radio('data', 'full', 'Anna, with 14 trips') + radio('data', 'new', 'New creator, nothing yet') + '</div>' +
            '<div class="proto-sec"><span class="proto-label">Loading</span><label class="proto-opt"><input type="checkbox"' + (d.slow ? ' checked' : '') + ' data-act="demoSlow">Slow connection (3 second loads)</label></div>' +
      '<div class="proto-sec"><span class="proto-label">Jump to</span><button type="button" class="proto-act" data-act="demoTimeout">Logged out after inactivity</button><button type="button" class="proto-act" data-act="demoError">Error page</button><button type="button" class="proto-act" data-act="demoNoMethod">No payout method yet</button><button type="button" class="proto-act" data-act="demoReset">Start over</button></div></div>';
  }
  h += '<button type="button" class="proto-btn" data-act="protoToggle" aria-expanded="' + d.open + '"><span class="proto-dot" aria-hidden="true"></span>Prototype</button></div>';
  return h;
}

/* ---------- render ---------- */
var root = document.getElementById('root');
function render() {
  var a = document.activeElement, fid = a && a.id, ss = null, se = null;
  try { if (fid && a.selectionStart != null) { ss = a.selectionStart; se = a.selectionEnd; } } catch (e) {}
  var r = S.route, html;
  if (r === 'login') html = viewLogin();
  else if (r === 'error') html = viewError();
  else {
    var c = r === 'dashboard' ? viewDashboard() : r === 'trips' ? viewTrips() : r === 'payouts' ? viewPayouts() : r === 'bank' ? viewBank() : r === 'profile' ? viewProfile() : r.indexOf('trip-') === 0 ? viewTrip(r.slice(5)) : viewDashboard();
    html = shell(c);
  }
  html += protoPanel();
  if (S.toast) html += '<div class="toast" role="status">' + esc(S.toast) + '</div>';
  root.innerHTML = html;
  var titles = { login: 'Log in', dashboard: 'Dashboard', trips: 'All trips', payouts: 'Payouts', bank: 'Bank settings', profile: 'Personal settings', error: 'Something went wrong' };
  document.title = (titles[r] || (r.indexOf('trip-') === 0 ? 'Trip' : 'Holicay')) + ' · Holicay Travel Creator';
  if (fid) {
    var el = document.getElementById(fid);
    if (el) { el.focus({ preventScroll: true }); try { if (ss != null) el.setSelectionRange(ss, se); } catch (e) {} }
  }
}

/* ---------- routing ---------- */
var APP = ['dashboard', 'trips', 'payouts', 'bank', 'profile'];
function go(route) { if (location.hash.slice(1) === route) onRoute(); else location.hash = route; }
function onRoute() {
  var r = location.hash.slice(1) || 'login';
  var known = r === 'login' || r === 'error' || APP.indexOf(r) >= 0 || r.indexOf('trip-') === 0;
  if (!known) r = S.authed ? 'dashboard' : 'login';
  if (r !== 'login' && r !== 'error') S.authed = true;
  var changed = S.route !== r;
  S.route = r; S.menu = false;
  if (changed) {
    S.dash.share = false; S.dash.tip = false; S.dash.payTip = false; S.dash.calOpen = false; S.trips.calOpen = false; S.me.del = false; S.bank.verifyOpen = false;
    if (r !== 'login' && r !== 'error') {
      S.loading = true;
      later('load', S.demo.slow ? 3000 : 550, function () { S.loading = false; });
    } else S.loading = false;
    window.scrollTo(0, 0);
  }
  render();
}
window.addEventListener('hashchange', onRoute);

/* ---------- state path helpers ---------- */
function getPath(p) { return p.split('.').reduce(function (o, k) { return o[k]; }, S); }
function setPath(p, val) { var ks = p.split('.'), o = S; for (var i = 0; i < ks.length - 1; i++) o = o[ks[i]]; o[ks[ks.length - 1]] = val; }

/* ---------- actions ---------- */
function logout(info) {
  var demo = S.demo; demo.open = false;
  var bank = S.bank, me = S.me;
  S.authed = false; S.login = freshState().login; S.login.info = info || 'loggedout';
  S.bank = bank; S.me = me; S.demo = demo; S.me.del = false;
  go('login');
}
var ACT = {
  mini: function () { S.mini = !S.mini; },
  menu: function () { S.menu = !S.menu; },
  logout: function () { logout('loggedout'); },
  viewPage: function () { toast('Your creator page opens at holicay.com/creator/anna'); },
  help: function () { toast('Email creators@holicay.com and the team will reply within a day'); },
  goForgot: function () { var L = S.login; L.screen = 'forgot'; L.errors = {}; L.banner = L.banner === 'locked' ? 'locked' : null; L.info = null; L.femail = L.femail || L.email; },
  goLogin: function () { var L = S.login; L.screen = 'login'; L.errors = {}; L.info = null; L.resent = false; },
  resendReset: function () { S.login.resent = true; },
  openReset: function () { var L = S.login; L.screen = 'reset'; L.newpw = ''; L.confirm = ''; L.errors = {}; },
  openExpired: function () { S.login.screen = 'expired'; },
  fillDemo: function () { var L = S.login; L.email = 'anna.wong@example.com'; L.password = 'holicay2026'; L.errors = {}; },
  range: function (arg, el) { var o = S[el.dataset.scope]; o.range = arg; o.rangeErr = ''; o.page = 0; if (arg === 'c') openCal(o); else o.calOpen = false; },
  toggleCal: function (arg, el) { var o = S[el.dataset.scope]; if (o.calOpen) o.calOpen = false; else openCal(o); },
  calNav: function (arg, el) { var o = S[el.dataset.scope]; var v = shiftM(o.cal.view, +arg); if (shiftM(v, 1) <= TODAY.slice(0, 7)) o.cal.view = v; },
  calDay: function (arg, el) { var c = S[el.dataset.scope].cal; if (!c.s || c.e) { c.s = arg; c.e = null; } else if (arg < c.s) { c.e = c.s; c.s = arg; } else c.e = arg; },
  calCancel: function (arg, el) { S[el.dataset.scope].calOpen = false; },
  calApply: function (arg, el) { var o = S[el.dataset.scope]; if (!o.cal.e) return; o.af = o.from = o.cal.s; o.at = o.to = o.cal.e; o.calOpen = false; o.page = 0; },
  applyRange: function (arg, el) {
    var o = S[el.dataset.scope], err = checkRange(o.from, o.to);
    o.rangeErr = err; if (!err) { o.af = o.from; o.at = o.to; o.page = 0; }
  },
  tip: function () { S.dash.tip = !S.dash.tip; S.dash.payTip = false; },
  payTip: function () { S.dash.payTip = !S.dash.payTip; S.dash.tip = false; },
  dashFilter: function (arg) { S.dash.filter = arg; },
  tripsFilter: function (arg) { S.trips.filter = arg; S.trips.page = 0; },
  payFilter: function (arg) { S.pay.filter = arg; },
  page: function (arg) { S.trips.page = Math.max(0, S.trips.page + (+arg)); window.scrollTo(0, 0); },
  clearSearch: function () { S.trips.q = ''; S.trips.page = 0; },
  last30: function () { var T = S.trips; T.range = '30'; T.filter = 'all'; T.src = 'all'; T.pkg = 'all'; T.rangeErr = ''; T.page = 0; },
  copyCode: function () { copyText('ANNA10'); flash(S.dash, 'copied'); },
  copyLink: function (arg, el) { copyText('https://holicay.com/creator/anna'); flash(S[el.dataset.scope], 'linkCopied'); },
  openShare: function () { S.dash.share = true; },
  closeShare: function () { S.dash.share = false; },
  pickMethod: function (arg) { var B = S.bank; B.method = arg; B.errors = {}; B.ok = false; },
  setKind: function (arg) { S.bank.v.kind = arg; },
  bankDismiss: function () { S.bank.ok = false; },
  bankReset: function () { var B = S.bank; B.method = B.cur; B.v = Object.assign({}, B.saved); B.errors = {}; B.ok = false; },
  bankSave: function () {
    var B = S.bank, er = bankValidate();
    if (Object.keys(er).length) { B.errors = er; B.ok = false; setTimeout(function () { var f = document.querySelector('.fld input.bad'); if (f) f.focus(); }, 0); return; }
    B.errors = {}; B.saving = true;
    later('bankSave', 900, function () { B.saving = false; B.verifyOpen = true; B.code = ''; B.codeErr = ''; B.resent = false; setTimeout(function () { var c = document.getElementById('code'); if (c) c.focus(); }, 0); });
  },
  bankVerify: function () {
    var B = S.bank;
    if (!/^\d{6}$/.test(B.code)) { B.codeErr = 'Enter the 6-digit code from your email.'; return; }
    B.verifying = true;
    later('bankVerify', 900, function () {
      var changing = B.cur && B.cur !== B.method;
      B.verifying = false; B.verifyOpen = false; B.ok = true; B.saved = Object.assign({}, B.v);
      if (changing) { B.pend = B.method; later('bankPend', 8000, function () { B.cur = B.pend; B.pend = null; toast('Your new payout details are verified'); }); }
      else { B.cur = B.method; B.pend = null; }
      window.scrollTo(0, 0);
    });
  },
  bankCloseVerify: function () { S.bank.verifyOpen = false; S.bank.codeErr = ''; },
  bankResend: function () { S.bank.resent = true; },
  meEdit: function () { var M = S.me; M.editing = true; M.saved = false; M.v = { cur: '', nw: '', cf: '' }; M.errors = {}; setTimeout(function () { var c = document.getElementById('pw-cur'); if (c) c.focus(); }, 0); },
  meCancel: function () { var M = S.me; M.editing = false; M.errors = {}; },
  meDismiss: function () { S.me.saved = false; },
  meSubmit: function () {
    var M = S.me, v = M.v, er = {};
    if (!v.cur) er.cur = 'Enter your current password.';
    else if (v.cur !== 'holicay2026') er.cur = 'That password is incorrect. Try again, or log out and use Forgot password.';
    if (!(v.nw.length >= 8 && /[A-Za-z]/.test(v.nw) && /\d/.test(v.nw))) er.nw = 'Use at least 8 characters, with at least one letter and one number.';
    else if (v.nw === v.cur) er.nw = 'Choose a password that’s different from your current one.';
    if (!v.cf) er.cf = 'Enter your new password again.';
    else if (v.cf !== v.nw) er.cf = 'Passwords don’t match. Enter the same password in both fields.';
    if (Object.keys(er).length) { M.errors = er; return; }
    M.busy = true;
    later('mePw', 900, function () { M.busy = false; M.editing = false; M.saved = true; M.errors = {}; window.scrollTo(0, 0); });
  },
  notif: function (arg) { S.me.n[arg] = !S.me.n[arg]; flash(S.me, 'nSaved'); },
  removePhoto: function () { S.me.photo = null; },
  openDelete: function () { S.me.del = true; S.me.delOk = false; },
  closeDelete: function () { S.me.del = false; },
  toggleDel: function () { S.me.delOk = !S.me.delOk; },
  doDelete: function () { S.me.del = false; logout('deleted'); },
  protoToggle: function () { S.demo.open = !S.demo.open; },
  demo: function (arg, el) {
    var g = el.dataset.group; S.demo[g] = arg;
    if (g === 'data') { S.bank.cur = arg === 'new' ? null : 'wise'; S.bank.method = S.bank.cur; S.bank.pend = null; S.bank.ok = false; S.bank.errors = {}; }
    S.dash.filter = 'all'; S.trips.page = 0; S.pay.filter = 'all';
    if (S.route !== 'login' && S.route !== 'error') { S.loading = true; later('load', S.demo.slow ? 3000 : 550, function () { S.loading = false; }); }
  },
  demoSlow: function () { S.demo.slow = !S.demo.slow; },
  demoTimeout: function () { logout('session'); S.login.email = 'anna.wong@example.com'; },
  demoError: function () { S.demo.open = false; go('error'); },
  demoNoMethod: function () { var B = S.bank; B.cur = null; B.method = null; B.pend = null; B.ok = false; B.errors = {}; S.demo.open = false; go('bank'); },
  demoReset: function () { Object.keys(timers).forEach(function (k) { clearTimeout(timers[k]); }); S = freshState(); go('login'); }
};

/* ---------- events ---------- */
document.addEventListener('click', function (ev) {
  var el = ev.target.closest('[data-act]');
  if (el && el.tagName !== 'INPUT' && el.tagName !== 'SELECT') {
    if (el.dataset.self && ev.target !== el) { /* clicks inside dialog */ }
    else {
      if (el.tagName === 'A') ev.preventDefault();
      var fn = ACT[el.dataset.act];
      if (fn) { fn(el.dataset.arg, el, ev); render(); }
      return;
    }
  }
  var row = ev.target.closest('tr[data-go]');
  if (row && !ev.target.closest('a,button')) go(row.dataset.go);
});
document.addEventListener('change', function (ev) {
  var el = ev.target;
  if (el.dataset.act === 'photo') {
    var f = el.files && el.files[0];
    if (!f) return;
    if (f.size > 5 * 1024 * 1024) { S.me.photoErr = 'That photo is over 5 MB. Choose a smaller one.'; render(); return; }
    if (!/^image\/(png|jpeg)$/.test(f.type)) { S.me.photoErr = 'Choose a JPG or PNG photo.'; render(); return; }
    var rd = new FileReader();
    rd.onload = function () { S.me.photo = rd.result; S.me.photoErr = ''; render(); toast('Photo updated'); };
    rd.readAsDataURL(f);
    return;
  }
  if (el.dataset.act && (el.type === 'radio' || el.type === 'checkbox')) {
    var fn = ACT[el.dataset.act]; if (fn) { fn(el.dataset.arg, el, ev); render(); } return;
  }
  if (el.dataset.bind && el.dataset.on === 'change') bindValue(el);
});
document.addEventListener('input', function (ev) {
  var el = ev.target;
  if (el.dataset.bind && el.dataset.on !== 'change') bindValue(el);
});
function bindValue(el) {
  var val = el.value;
  if (el.dataset.digits) { val = val.replace(/\D/g, '').slice(0, 6); S.bank.codeErr = ''; }
  setPath(el.dataset.bind, val);
  var b = el.dataset.bind.split('.');
  if (b[0] === 'login') S.login.errors[b[1]] = '';
  if (b[0] === 'dash' || b[0] === 'trips') { if (b[1] === 'from' || b[1] === 'to') S[b[0]].rangeErr = ''; }
  if (el.dataset.resetPage) S.trips.page = 0;
  if (el.dataset.clear) { var c = el.dataset.clear.split('.'); delete S[c[0]].errors[c[1]]; }
  if (el.dataset.clearAll) S[el.dataset.clearAll].errors = {};
  if (b[0] === 'bank') S.bank.ok = false;
  render();
}
document.addEventListener('submit', function (ev) {
  ev.preventDefault();
  var f = ev.target.dataset.form, L = S.login, er = {};
  if (f === 'login') {
    if (L.banner === 'locked' || L.busy) return;
    if (!L.email.trim()) er.email = 'Enter your email address.'; else if (!EM.test(L.email.trim())) er.email = BADEMAIL;
    if (!L.password) er.password = 'Enter your password.';
    L.errors = er; L.info = null;
    if (Object.keys(er).length) { render(); var b = document.querySelector('input.bad'); if (b) b.focus(); return; }
    L.busy = true; render();
    later('login', 900, function () {
      L.busy = false;
      if (L.email.trim().toLowerCase() === 'anna.wong@example.com' && L.password === 'holicay2026') { L.attempts = 0; L.banner = null; go('dashboard'); }
      else { L.attempts++; L.banner = L.attempts >= 5 ? 'locked' : 'wrong'; L.password = ''; }
    });
    return;
  }
  if (f === 'forgot') {
    if (!L.femail.trim()) L.errors = { femail: 'Enter your email address.' };
    else if (!EM.test(L.femail.trim())) L.errors = { femail: BADEMAIL };
    else { L.screen = 'sent'; L.errors = {}; L.resent = false; }
    render(); return;
  }
  if (f === 'reset') {
    var ok = L.newpw.length >= 8 && /[A-Za-z]/.test(L.newpw) && /\d/.test(L.newpw);
    if (!ok) er.newpw = 'Use at least 8 characters, with at least one letter and one number.';
    if (!L.confirm) er.confirm = 'Enter your new password again.'; else if (L.confirm !== L.newpw) er.confirm = 'Passwords don’t match. Enter the same password in both fields.';
    L.errors = er;
    if (!Object.keys(er).length) { L.screen = 'done'; L.attempts = 0; L.banner = null; L.password = ''; }
    render();
  }
});
document.addEventListener('keydown', function (ev) {
  if (ev.key !== 'Escape') return;
  if (S.dash.share) S.dash.share = false;
  else if (S.me.del) S.me.del = false;
  else if (S.bank.verifyOpen && !S.bank.verifying) S.bank.verifyOpen = false;
  else if (S.dash.calOpen || S.trips.calOpen) { S.dash.calOpen = false; S.trips.calOpen = false; }
  else if (S.dash.tip || S.dash.payTip) { S.dash.tip = false; S.dash.payTip = false; }
  else if (S.demo.open) S.demo.open = false;
  else return;
  render();
});

onRoute();
})();
</script>
